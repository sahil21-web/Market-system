name: Weekly Wealth Screen

on:
  schedule:
    # 03:00 UTC Saturday = 8:30 AM IST Saturday
    - cron: "0 3 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly screen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_weekly.py

      - name: Commit log file back to repo
        run: |
          git config user.name "market-system-bot"
          git config user.email "actions@github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "Weekly run $(date -I)"
          git push
