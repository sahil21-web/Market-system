name: Daily Market Brief

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST, Mon-Fri (after NSE close at 3:30 PM IST)
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily screen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_daily.py

      - name: Commit log file back to repo
        run: |
          git config user.name "market-system-bot"
          git config user.email "actions@github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "Daily run $(date -I)"
          git push
